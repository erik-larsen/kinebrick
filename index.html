<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KineBrick</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #e4e8ee; font: 13px/1.4 system-ui, sans-serif; color: #1d2430; }
      #panel { position: fixed; top: 12px; left: 12px; background: rgba(255, 255, 255, 0.9); border-radius: 8px; padding: 10px 12px; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15); }
      #panel h1 { font-size: 15px; margin: 0 0 4px; }
      #panel label { display: block; margin-top: 4px; cursor: pointer; }
      #summary, #hint { color: #5a6475; }
      #hint { margin-top: 6px; font-size: 12px; }
      #warning { display: none; margin-top: 6px; max-width: 260px; color: #b3261e; font-size: 12px; }
      #panel select { font: inherit; margin: 2px 0 4px; }
      #panel button { margin-top: 8px; font: inherit; padding: 2px 10px; cursor: pointer; }
      #readout { position: fixed; bottom: 12px; left: 12px; background: rgba(255, 255, 255, 0.9); border-radius: 8px; padding: 8px 12px; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15); white-space: pre; font-variant-numeric: tabular-nums; }
      #readout:empty { display: none; }
      #label { position: fixed; pointer-events: none; background: #1d2430; color: #fff; padding: 4px 8px; border-radius: 4px; white-space: nowrap; display: none; }
    </style>
  </head>
  <body>
    <div id="panel">
      <h1>KineBrick</h1>
      <select id="model"></select>
      <div id="summary">Loading…</div>
      <div id="warning"></div>
      <label><input type="checkbox" id="bodyColours" checked /> Body colours</label>
      <label><input type="checkbox" id="jointAxes" checked /> Joints and gear meshes</label>
      <div id="hint">Alt-click (Option-click on a Mac) a part to hold it still</div>
      <button id="reset">Reset</button>
      <button id="letGo">Let go of all</button>
    </div>
    <div id="readout"></div>
    <div id="label"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
