<meta charset="utf-8">
<title>Kinebrick Set Status</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: a line graph of the sets in each colour over time, then a short summary, then one treemap of every set (area = pieces, colour = share working), then the picked set's functions, then failing functions by cause. */
:root {
  --bg: #f6f5f0; --panel: #ffffff; --fg: #17202e; --muted: #5a6474; --line: #d9d6cc;
  --all: #2f9e5b; --most: #f2c230; --half: #f08a24; --few: #d43d2f; --none: #101114; --unchecked: #a9aeb8;
  --on-dark: #ffffff; --on-light: #17202e; --bar: #3d6fb4; --edge: #ffffff; --none-edge: #ffffff;
  --display: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
  --text: 'Inter', 'Helvetica Neue', Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #15181e; --panel: #1e222b; --fg: #eceef2; --muted: #a3acba; --line: #363c49; --edge: #1e222b; --none-edge: #a3acba; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #15181e; --panel: #1e222b; --fg: #eceef2; --muted: #a3acba; --line: #363c49; --edge: #1e222b; --none-edge: #a3acba; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--text); font-size: 15px; line-height: 1.45; padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 1280px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }
h1 { font-family: var(--display); font-size: 30px; font-weight: 700; line-height: 1.15; text-wrap: balance; }
.sub { color: var(--muted); }
.totals { display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: baseline; }
.totals b { font-family: var(--display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; font-variant-numeric: tabular-nums; }
.legend i { width: 15px; height: 15px; border-radius: 3px; box-shadow: inset 0 0 0 1px var(--line); }
#map { position: relative; width: 100%; height: clamp(420px, 58vw, 760px); }
.box { position: absolute; overflow: hidden; border: 0; border-radius: 3px; padding: 3px 5px; text-align: left; font: 600 12px/1.25 var(--text); cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); }
.box small { display: block; font-weight: 400; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.box:hover, .box:focus-visible, .box[aria-pressed="true"] { outline: 3px solid var(--fg); outline-offset: -3px; }
.b4 { background: var(--all); color: var(--on-dark); } .b3 { background: var(--most); color: var(--on-light); } .b2 { background: var(--half); color: var(--on-light); }
.b1 { background: var(--few); color: var(--on-dark); } .b0 { background: var(--none); color: var(--on-dark); } .b5 { background: var(--unchecked); color: var(--on-light); }
#detail { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; min-height: 96px; }
#detail h2 { font-family: var(--display); font-size: 21px; font-weight: 700; }
#detail a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
#detail ul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 6px; }
#detail li { display: flex; gap: 10px; align-items: baseline; }
.tag { flex: none; width: 92px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.works { color: var(--all); } .partly { color: var(--half); } .no { color: var(--few); } .other { color: var(--muted); }
.why { color: var(--muted); font-size: 13px; }
#causes { display: flex; flex-direction: column; gap: 10px; }
#causes h2 { font-family: var(--display); font-size: 21px; font-weight: 700; }
.cause { display: grid; grid-template-columns: 3.2em minmax(0, 1fr); gap: 2px 12px; align-items: center; }
.cause b { font-family: var(--display); font-size: 19px; text-align: right; font-variant-numeric: tabular-nums; }
.cause .track { grid-column: 2; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.cause .fill { display: block; height: 100%; background: var(--bar); border-radius: 4px; }
.cause .who { color: var(--muted); font-size: 13px; }
#trend { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
#trend h2 { font-family: var(--display); font-size: 21px; font-weight: 700; }
#chart { position: relative; }
#chart svg { display: block; width: 100%; overflow: visible; }
#chart text { font: 12px var(--text); fill: var(--muted); font-variant-numeric: tabular-nums; }
#chart .end { fill: var(--fg); font-weight: 600; }
#chart .grid { stroke: var(--line); stroke-width: 1; }
#chart .cross { stroke: var(--muted); stroke-width: 1; }
#chart .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
#chart .casing { fill: none; stroke: var(--edge); stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
#chart .casing.k0 { stroke: var(--none-edge); stroke-width: 4; }
#chart circle { stroke: var(--edge); stroke-width: 1.5; }
#chart circle.k0 { stroke: var(--none-edge); }
#tip { position: absolute; top: 0; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 14px rgb(0 0 0 / 0.18); display: grid; gap: 3px; white-space: nowrap; }
#tip[hidden] { display: none; }
#tip span { display: flex; align-items: center; gap: 7px; font-variant-numeric: tabular-nums; }
#tip i { width: 11px; height: 11px; border-radius: 3px; box-shadow: inset 0 0 0 1px var(--line); }
#tip b { margin-left: auto; padding-left: 14px; }
#trend summary { cursor: pointer; color: var(--muted); font-size: 13px; }
#trend .scroll { overflow-x: auto; }
#trend table { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; margin-top: 8px; }
#trend th, #trend td { padding: 3px 12px 3px 0; text-align: right; white-space: nowrap; }
#trend th { color: var(--muted); font-weight: 600; }
#trend th:first-child, #trend td:first-child, #trend th:nth-child(2), #trend td:nth-child(2) { text-align: left; }
#times { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
#times h2 { font-family: var(--display); font-size: 21px; font-weight: 700; }
#times .scroll { overflow: auto; max-height: 70vh; }
#times table { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; width: 100%; }
#times th, #times td { padding: 5px 14px 5px 0; text-align: right; vertical-align: top; white-space: nowrap; border-bottom: 1px solid var(--line); }
#times th { position: sticky; top: 0; background: var(--panel); color: var(--muted); font-weight: 600; }
#times th button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
#times th[aria-sort] button { color: var(--fg); }
#times th:nth-child(-n+2), #times td:nth-child(-n+2) { text-align: left; }
#times td:nth-child(2) { white-space: normal; min-width: 260px; max-width: 520px; }
#times a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
#times .none { color: var(--muted); }
@media (max-width: 640px) { #map { height: 150vw; } h1 { font-size: 24px; } }
</style>
<div class="page">
  <header>
    <h1 id="heading">Every OMR Technic set, by how much of it works</h1>
    <p class="sub" id="when"></p>
  </header>
  <section id="trend" hidden>
    <h2>Set Status Over Time</h2>
    <p class="sub" id="trend-sub"></p>
    <div class="legend" id="trend-legend"></div>
    <div id="chart"></div>
    <details><summary>The numbers behind the graph</summary><div class="scroll"><table id="trend-table"></table></div></details>
  </section>
  <div class="totals" id="totals"></div>
  <div class="legend" id="legend"></div>
  <div id="map" aria-label="One box for each set. A box's area is the set's number of pieces. Its colour is the share of its checked functions that work."></div>
  <section id="detail" aria-live="polite"><p class="sub">Pick a box to see that set's functions. A box's area is the set's number of pieces.</p></section>
  <section id="times" hidden>
    <h2>Time for One Small Turn in the Viewer</h2>
    <p class="sub" id="times-sub"></p>
    <div class="scroll"><table id="times-table"></table></div>
  </section>
  <section id="causes" hidden></section>
</div>
<script>
const DATA = /*DATA*/null;
const PREVIEW = 'https://erik-larsen.github.io/kinebrick/preview/';
// The viewer on Erik's computer (npm run dev on the preview branch), for the sets the preview site doesn't have.
const LOCAL = 'http://localhost:5174/';
const BUCKETS = [
  { id: 4, label: 'All work' }, { id: 3, label: '75% to 99%' }, { id: 2, label: '50% to 74%' },
  { id: 1, label: '1% to 49%' }, { id: 0, label: 'None work' }, { id: 5, label: 'Nothing checked' },
];
const VARS = { 4: '--all', 3: '--most', 2: '--half', 1: '--few', 0: '--none', 5: '--unchecked' };
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const count = (s, r) => s.functions.filter((f) => f[1] === r).length;

// Each set's counts, its share working, and its colour bucket.
const sets = (DATA ? DATA.sets : []).map((s) => {
  const works = count(s, 'works'), partly = count(s, 'partly'), no = count(s, 'no');
  const checked = works + partly + no;
  const share = checked ? works / checked : null;
  // A set whose track isn't read as a track is never green, whatever its functions' results.
  const bucket = share === null ? 5 : share >= 1 ? (s.unreadTracks ? 3 : 4) : share >= 0.75 ? 3 : share >= 0.5 ? 2 : share > 0 ? 1 : 0;
  return { ...s, works, partly, no, checked, share, bucket, number: s.set.replace(/-1$/, '') };
}).sort((a, b) => b.pieces - a.pieces);

// A squarified treemap: rectangles whose areas are in proportion to each set's pieces.
function treemap(items, W, H) {
  const total = items.reduce((sum, d) => sum + d.pieces, 0);
  const nodes = items.map((d) => ({ d, area: (d.pieces * W * H) / total }));
  const out = [];
  let x = 0, y = 0, w = W, h = H, row = [], i = 0;
  const worst = (r, side) => {
    const sum = r.reduce((s, n) => s + n.area, 0);
    const max = Math.max(...r.map((n) => n.area)), min = Math.min(...r.map((n) => n.area));
    return Math.max((side * side * max) / (sum * sum), (sum * sum) / (side * side * min));
  };
  const place = (r) => {
    const sum = r.reduce((s, n) => s + n.area, 0);
    if (w >= h) {
      const cw = sum / h; let cy = y;
      for (const n of r) { const ch = n.area / cw; out.push({ d: n.d, x, y: cy, w: cw, h: ch }); cy += ch; }
      x += cw; w -= cw;
    } else {
      const rh = sum / w; let cx = x;
      for (const n of r) { const rw = n.area / rh; out.push({ d: n.d, x: cx, y, w: rw, h: rh }); cx += rw; }
      y += rh; h -= rh;
    }
  };
  while (i < nodes.length) {
    const side = Math.min(w, h), next = row.concat([nodes[i]]);
    if (row.length === 0 || worst(next, side) <= worst(row, side)) { row = next; i++; } else { place(row); row = []; }
  }
  if (row.length) place(row);
  return out;
}

const pct = (s) => (s.share === null ? 'nothing checked' : Math.round(s.share * 100) + '%');
// A time in the viewer, in ms, as the page writes it.
const ms = (n) => (n === null || n === undefined ? 'not timed' : Math.round(n).toLocaleString('en') + ' ms');
// Where a set opens in Kinebrick: on the preview site where it has the set, else in the viewer on this computer.
const plus = (text) => encodeURIComponent(text).replace(/%20/g, '+');
const opens = (s) => s.link || (s.viewer ? PREVIEW + '?model=' + plus(s.viewer) : LOCAL + '?file=' + s.file.split('/').map(plus).join('/'));
let picked = null;

function show(s) {
  picked = s.set;
  document.querySelectorAll('.box').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.set === s.set)));
  const d = document.getElementById('detail');
  const link = (text, href) => { const a = el('a', '', text); a.href = href; a.target = '_blank'; a.rel = 'noopener'; return a; };
  // The title opens the set in Kinebrick: at its own address, if the page gives one (a train set's);
  // on the preview site where it has the set; and otherwise in the viewer on this computer (LOCAL),
  // which reads the set's file from the OMR. The pieces open its page in the OMR.
  const title = el('h2');
  title.append(link(`${s.number} ${s.name}`, opens(s)));
  const sub = el('p', 'sub', `${s.year} · `);
  const pieces = `${s.pieces.toLocaleString('en')} pieces`;
  sub.append(s.omr ? link(pieces, s.omr) : pieces, ` · ${s.works} of ${s.checked} checked functions work (${pct(s)})` + (s.loose ? ` · ${s.loose.toLocaleString('en')} loose parts` : '') + (s.link || s.viewer ? '' : ' · opens in the viewer on this computer (port 5174)'));
  d.replaceChildren(title, sub);
  if (s.unreadTracks) d.append(el('p', 'why', `Not green: its track is not read as a track. The file draws ${s.unreadTracks.links} track links (${s.unreadTracks.parts.join(', ')}) one by one, with no path, so they do not run round their wheels: turning a sprocket moves a few links and leaves the rest.`));
  const list = el('ul');
  const order = { no: 0, partly: 1, works: 2 };
  for (const [does, result, cause, about, time] of [...s.functions].sort((a, b) => (order[a[1]] ?? 3) - (order[b[1]] ?? 3))) {
    const li = el('li');
    const label = result === 'no' ? "doesn't work" : result;
    const text = el('span', '', does);
    if (cause && DATA.causes[cause]) text.append(el('br'), el('span', 'why', `Why: ${DATA.causes[cause].says}${about ? ` (${about})` : ''}. For: ${DATA.causes[cause].owner}.`));
    if (time) text.append(el('br'), el('span', 'why', `In the viewer: one small turn takes ${ms(time[0])}, a step in a long turn ${ms(time[1])}.`));
    li.append(el('span', 'tag ' + (result in order ? result : 'other'), label), text);
    list.append(li);
  }
  d.append(list);
}

function draw() {
  const map = document.getElementById('map');
  const W = map.clientWidth, H = map.clientHeight;
  map.replaceChildren();
  for (const r of treemap(sets, W, H)) {
    const s = r.d;
    const b = el('button', 'box b' + s.bucket);
    b.type = 'button';
    b.dataset.set = s.set;
    b.style.cssText = `left:${r.x}px;top:${r.y}px;width:${Math.max(1, r.w - 1)}px;height:${Math.max(1, r.h - 1)}px`;
    b.title = `${s.number} ${s.name}: ${s.works} of ${s.checked} work (${pct(s)}), ${s.pieces} pieces`;
    b.setAttribute('aria-label', b.title);
    b.setAttribute('aria-pressed', String(picked === s.set));
    if (r.w > 44 && r.h > 20) b.append(s.number);
    if (r.w > 96 && r.h > 50) b.append(el('small', '', s.name), el('small', '', pct(s)));
    b.addEventListener('click', () => show(s));
    map.append(b);
  }
}

// The table of times: every function the viewer sweep has timed, the slowest first, or in the
// order of the column picked.
let timesBy = 2, timesDown = true;
function times() {
  const rows = [];
  for (const s of sets) s.functions.forEach((f, i) => { if (f[4]) rows.push({ s, n: i + 1, does: f[0], one: f[4][0], step: f[4][1], verdict: f[4][2] }); });
  if (!rows.length) return;
  document.getElementById('times').hidden = false;
  const working = sets.reduce((t, s) => t + s.works, 0);
  const timedSets = new Set(rows.map((r) => r.s.set)).size;
  const noOne = rows.filter((r) => r.one === null).length;
  document.getElementById('times-sub').textContent = `${rows.length.toLocaleString('en')} of the ${working.toLocaleString('en')} working functions timed so far, in ${timedSets} sets` + (rows.length < working ? '; the sweep is still running' : '') + `. One small turn is the first move of a drag: the viewer chooses what to hold still and turns the control by one solver step (0.035 radian). A step in a long turn is about what each further frame of the same drag costs. All of these were measured while checks ran on the same computer, so they are higher than on a quiet one, by a factor not known; the slowest are timed again on a quiet computer when the run is through (decision 261).` + (noOne ? ` ${noOne} were timed before the sweep measured one small turn.` : '') + ' The last column is not final: where it says no, the sweep either found a fault or could not yet do what the check does (it does not free pins that friction holds, and some controls it cannot turn); those are being sorted (decision 267). A set opens in the viewer from its number.';
  const cols = [
    ['Set', (r) => r.s.set.replace(/-1$/, '').padStart(6, '0') + String(r.n).padStart(3, '0')],
    ['Function', (r) => r.does],
    ['One small turn', (r) => r.one ?? r.step ?? -1],
    ['A step in a long turn', (r) => r.step ?? -1],
    ['Pieces', (r) => r.s.pieces],
    ['The turn moves it', (r) => r.verdict],
  ];
  const key = cols[timesBy][1];
  rows.sort((a, b) => { const x = key(a), y = key(b); return (x < y ? -1 : x > y ? 1 : 0) * (timesDown ? -1 : 1); });
  const table = document.getElementById('times-table');
  table.replaceChildren();
  const head = el('tr');
  cols.forEach(([label], c) => {
    const th = el('th');
    const b = el('button', '', label);
    b.type = 'button';
    b.title = 'Sort by this column';
    b.addEventListener('click', () => { timesDown = timesBy === c ? !timesDown : c >= 2 && c <= 4; timesBy = c; times(); });
    if (timesBy === c) th.setAttribute('aria-sort', timesDown ? 'descending' : 'ascending');
    th.append(b, timesBy === c ? (timesDown ? ' ↓' : ' ↑') : '');
    head.append(th);
  });
  table.append(head);
  const said = { shown: 'yes', 'not shown': 'no', 'not decided': 'not decided' };
  for (const r of rows) {
    const tr = el('tr');
    const set = el('td');
    const a = el('a', '', r.s.number); a.href = opens(r.s); a.target = '_blank'; a.rel = 'noopener'; a.title = r.s.name;
    set.append(a, ` fn ${r.n}`);
    const one = el('td', r.one === null ? 'none' : '', ms(r.one));
    tr.append(set, el('td', '', r.does), one, el('td', r.step === null ? 'none' : '', ms(r.step)), el('td', '', r.s.pieces.toLocaleString('en')), el('td', '', said[r.verdict] ?? r.verdict));
    table.append(tr);
  }
}

// The graph: for each colour, how many sets had it after each commit that changed the count.
const NS = 'http://www.w3.org/2000/svg';
const svg = (tag, attrs, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text !== undefined) e.textContent = text; return e; };
const stamp = (seconds) => new Date(seconds * 1000).toLocaleString('en', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
function trend() {
  const pts = (DATA && DATA.history) || [];
  if (pts.length < 2) return;
  document.getElementById('trend').hidden = false;
  const shown = BUCKETS.filter((k) => pts.some((p) => p[2 + k.id] > 0));
  const last = pts[pts.length - 1];
  document.getElementById('trend-sub').textContent = `From the first status page, ${stamp(pts[0][0])}, to ${stamp(last[0])}. A point is a commit that changed how many sets have a colour.`;
  const legend = document.getElementById('trend-legend');
  legend.replaceChildren();
  for (const k of shown) { const span = el('span'); span.append(el('i', 'b' + k.id), `${k.label}: ${last[2 + k.id]}`); legend.append(span); }
  const chart = document.getElementById('chart');
  chart.replaceChildren();
  const W = Math.max(280, chart.clientWidth), H = 300, m = { l: 30, r: 34, t: 10, b: 26 };
  const t0 = pts[0][0], t1 = last[0];
  const top = Math.ceil(Math.max(...pts.flatMap((p) => p.slice(2))) / 20) * 20;
  const x = (t) => m.l + ((t - t0) / (t1 - t0)) * (W - m.l - m.r);
  const y = (n) => m.t + (1 - n / top) * (H - m.t - m.b);
  const g = svg('svg', { viewBox: `0 0 ${W} ${H}`, height: H, role: 'img', 'aria-label': 'Line graph: the number of sets in each colour over time. The numbers are in the table below.' });
  for (let n = 0; n <= top; n += 20) {
    g.append(svg('line', { class: 'grid', x1: m.l, x2: W - m.r, y1: y(n), y2: y(n) }), svg('text', { x: m.l - 8, y: y(n) + 4, 'text-anchor': 'end' }, n));
  }
  // A tick at the start of each day.
  const day = new Date(t0 * 1000); day.setHours(24, 0, 0, 0);
  for (; day.getTime() / 1000 < t1; day.setDate(day.getDate() + 1)) {
    const at = x(day.getTime() / 1000);
    g.append(svg('line', { class: 'grid', x1: at, x2: at, y1: H - m.b, y2: H - m.b + 5 }), svg('text', { x: at, y: H - 6, 'text-anchor': 'middle' }, day.toLocaleDateString('en', { day: 'numeric', month: 'short' })));
  }
  const cross = svg('line', { class: 'cross', y1: m.t, y2: H - m.b, visibility: 'hidden' });
  g.append(cross);
  for (const k of [...shown].reverse()) {
    const path = pts.map((p) => `${x(p[0]).toFixed(1)},${y(p[2 + k.id]).toFixed(1)}`).join(' ');
    g.append(svg('polyline', { class: 'casing k' + k.id, points: path }), svg('polyline', { class: 'ln', points: path, stroke: `var(${VARS[k.id]})` }));
    for (const p of pts) g.append(svg('circle', { class: 'k' + k.id, cx: x(p[0]), cy: y(p[2 + k.id]), r: 3, fill: `var(${VARS[k.id]})` }));
  }
  // Each line's last count at its end, moved apart where two would touch.
  const ends = shown.map((k) => ({ n: last[2 + k.id], at: y(last[2 + k.id]) })).sort((a, b) => a.at - b.at);
  for (let i = 1; i < ends.length; i++) ends[i].at = Math.max(ends[i].at, ends[i - 1].at + 14);
  for (const e of ends) g.append(svg('text', { class: 'end', x: W - m.r + 8, y: e.at + 4 }, e.n));
  chart.append(g);
  // The pointer picks the nearest point; a box says what it was.
  const tip = el('div'); tip.id = 'tip'; tip.hidden = true; chart.append(tip);
  const pick = (e) => {
    const px = ((e.clientX - g.getBoundingClientRect().left) / g.getBoundingClientRect().width) * W;
    const p = pts.reduce((a, b) => (Math.abs(x(b[0]) - px) < Math.abs(x(a[0]) - px) ? b : a));
    cross.setAttribute('x1', x(p[0])); cross.setAttribute('x2', x(p[0])); cross.setAttribute('visibility', 'visible');
    tip.replaceChildren(el('span', 'sub', `${stamp(p[0])} · ${p[1]}`));
    for (const k of shown) { const row = el('span'); row.append(el('i', 'b' + k.id), k.label, el('b', '', p[2 + k.id])); tip.append(row); }
    tip.hidden = false;
    const left = (x(p[0]) / W) * chart.clientWidth;
    tip.style.left = (left + tip.offsetWidth + 16 > chart.clientWidth ? left - tip.offsetWidth - 12 : left + 12) + 'px';
  };
  g.addEventListener('pointermove', pick);
  g.addEventListener('pointerdown', pick);
  g.addEventListener('pointerleave', () => { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); });
  const table = document.getElementById('trend-table');
  table.replaceChildren();
  const head = el('tr'); head.append(el('th', '', 'When'), el('th', '', 'Commit'), ...shown.map((k) => el('th', '', k.label))); table.append(head);
  for (const p of [...pts].reverse()) { const row = el('tr'); row.append(el('td', '', stamp(p[0])), el('td', '', p[1]), ...shown.map((k) => el('td', '', p[2 + k.id]))); table.append(row); }
}

if (DATA) {
  const sum = (k) => sets.reduce((t, s) => t + s[k], 0);
  const checked = sum('checked');
  if (DATA.title) document.getElementById('heading').textContent = document.title = DATA.title;
  document.getElementById('when').textContent = `${sets.length} sets. Results as stored at commit ${DATA.commit}, page made ${DATA.date}. Share working = functions that work ÷ functions checked.`;
  const totals = document.getElementById('totals');
  for (const [n, text] of [[sum('works'), `of ${checked.toLocaleString('en')} checked functions work (${Math.round((100 * sum('works')) / checked)}%)`], [sum('partly'), 'work partly'], [sum('no'), "don't work"], [sets.filter((s) => s.bucket === 4).length, 'sets with every checked function working']]) {
    const span = el('span');
    span.append(el('b', '', n.toLocaleString('en')), ' ' + text);
    totals.append(span);
  }
  const legend = document.getElementById('legend');
  for (const k of BUCKETS) {
    const n = sets.filter((s) => s.bucket === k.id).length;
    if (!n) continue;
    const span = el('span');
    const swatch = el('i', 'b' + k.id);
    span.append(swatch, `${k.label}: ${n} sets`);
    legend.append(span);
  }
  // Why the functions that don't work don't: how many have each cause, most common first.
  const tally = {};
  for (const s of sets) for (const f of s.functions) if (f[2]) tally[f[2]] = (tally[f[2]] || 0) + 1;
  const rows = Object.entries(tally).sort((a, b) => b[1] - a[1]);
  if (rows.length) {
    const box = document.getElementById('causes');
    box.hidden = false;
    const explained = rows.reduce((t, r) => t + r[1], 0);
    box.append(el('h2', '', 'Why functions fail'), el('p', 'sub', `${explained.toLocaleString('en')} of the ${(sum('partly') + sum('no')).toLocaleString('en')} functions that don't work in full have a cause, told from the motions the mechanism allows where the control starts.`));
    for (const [cause, n] of rows) {
      const c = DATA.causes[cause] || { says: cause, owner: '' };
      const row = el('div', 'cause');
      const track = el('span', 'track');
      const fill = el('span', 'fill');
      fill.style.width = (100 * n) / rows[0][1] + '%';
      track.append(fill);
      const words = el('span', '', c.says + ' ');
      words.append(el('span', 'who', `· for: ${c.owner}`));
      row.append(el('b', '', n.toLocaleString('en')), words, track);
      box.append(row);
    }
  }
  draw();
  trend();
  times();
  let timer = 0;
  window.addEventListener('resize', () => { clearTimeout(timer); timer = setTimeout(() => { draw(); trend(); }, 120); });
} else {
  document.getElementById('when').textContent = 'No data: make this page with npm run status.';
}
</script>
